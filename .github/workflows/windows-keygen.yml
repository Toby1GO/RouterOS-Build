name: Build Windows key generator
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Prepare signing keys
        env:
          LICENSE_PRIVATE: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          LICENSE_PUBLIC: ${{ secrets.CUSTOM_LICENSE_PUBLIC_KEY }}
        shell: python
        run: |
          import os
          from pathlib import Path
          from license import hex_key, public_from_private
          private, public = (hex_key(os.environ[n]) for n in ('LICENSE_PRIVATE', 'LICENSE_PUBLIC'))
          assert public_from_private(private) == public
          Path('.private').mkdir(exist_ok=True)
          Path('.private/signing.env').write_text('CUSTOM_LICENSE_PRIVATE_KEY='+private.hex()+'\nCUSTOM_LICENSE_PUBLIC_KEY='+public.hex()+'\n')
      - run: ./build_license_gui.ps1
      - name: Verify copied portable build
        shell: python
        run: |
          import json, pathlib, subprocess, zipfile
          dest=pathlib.Path('build/portable-test').resolve()
          zipfile.ZipFile('RouterOSKeygen-v3-portable.zip').extractall(dest)
          report=dest/'self-test.json'
          subprocess.run([str(dest/'RouterOSKeygen-v3/RouterOSKeygen-v3.exe'), '--self-test', str(report)], cwd=dest, check=True, timeout=60)
          data=json.loads(report.read_text())
          assert data['ok'] and data['frozen'] and data['key_source']=='embedded'
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-keygen-portable
          path: RouterOSKeygen-v3-portable.zip
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary key files
        if: always()
        run: Remove-Item -LiteralPath .private/signing.env -Force -ErrorAction SilentlyContinue
